<html lang="en"><head><meta charset="utf-8">

<style>

.g{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;padding:6px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);cursor:pointer}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

#go{background:var(--c1);color:#fff;border-color:var(--c1);font-weight:600}
#fl{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;opacity:.6}
.hc #bar{display:none}.hc #fl{display:block}

@media(max-width:800px){#cols{grid-template-columns:1fr}}
.col{border-top:8px solid var(--c)}

ol{list-style:none;margin:0;padding:0}

.qn{color:var(--c);min-width:1.6em}

sup{font-size:.7em}
svg text{fill:currentColor;stroke:none;font:14px "Segoe UI",sans-serif}
.v{display:inline-flex;flex-direction:column;border:solid currentColor;border-width:0 .09em;border-radius:.4em;padding:0 .3em;line-height:1.1;text-align:center;vertical-align:middle}.v i{font-style:normal}
</style></head><body>

<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),P=a=>a[R(0,a.length-1)],G=(a,b)=>b?G(b,a%b):Math.abs(a);
const fr=(n,d)=>`<span class=fr><i>${n}</i><i>${d}</i></span>`,sf=(n,d)=>{let g=G(n,d);n/=g;d/=g;return d==1?n:fr(n,d)};

const sum=a=>a.reduce((x,y)=>x+y,0),TR=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15],[7,24,25]];
const D=Math.PI/180,p3=n=>String(n).padStart(3,'0'),sq=n=>`√<span class=ov>${n}</span>`;
const sv=(w,h,b)=>`<svg viewBox="0 0 ${w} ${h}" style="width:${(w/22).toFixed(2)}em;max-width:100%;height:auto;stroke:currentColor;fill:none;stroke-width:1.5;display:block;margin-top:.3em">${b}</svg>`;
const tx=(x,y,s,a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}">${s}</text>`;
const vec=(a,b)=>`<span class=v><i>${mn(a)}</i><i>${mn(b)}</i></span>`;
const mix=(n,d)=>{let g=G(n,d);n/=g;d/=g;let w=Math.floor(n/d),r=n%d;return r?(w?`${w} ${fr(r,d)}`:fr(r,d)):w};
const rt=(v,b,h,g)=>sv(250,150,`<g transform="translate(20 0)"><path d="M30 120H210L30 40Z M30 108H42V120"/>`+tx(22,85,v,'end')+tx(120,140,b)+tx(140,72,h,'start')+tx(180,116,g)+'</g>');

const OFF={AR:[22,-8],AL:[-22,-8],BR:[24,18],BL:[-24,18]};
const par=(q,p)=>sv(240,150,`<path d="M10 40H230M10 110H230M55 130L145 20"/>`+[[129,40,q],[71,110,p]].map(([x,y,[r,s]])=>tx(x+OFF[r][0],y+OFF[r][1],s)).join(''));
const brg=(t,f)=>{let A=[100,130],B=[A[0]+70*Math.sin(t*D),A[1]-70*Math.cos(t*D)],C=f&&[B[0]+60*Math.sin(f*D),B[1]-60*Math.cos(f*D)],r=a=>a.map(v=>v.toFixed(0)).join(' ');return sv(260,230,`<path d="M${r(A)}L${r(B)}${C?'L'+r(C):''}M100 130V70M${r(B)}v-34"/>`+tx(A[0]-14,A[1]+14,'A')+tx(B[0]+8,B[1]-4,'B','start')+(C?tx(C[0]+8,C[1],'C','start'):'')+tx(100,64,'N')+tx(B[0],B[1]-40,'N'))};
const gr=(...p)=>{let s=20,o=110,g='';for(let i=-5;i<=5;i++)g+=`M${o+i*s} 10V210M10 ${o+i*s}H210`;return sv(220,220,`<path d="${g}" style="stroke-width:.4"/><path d="M10 110H210M110 10V210"/>`+p.map(([q,n],i)=>`<path d="M${q.map(([x,y])=>`${o+x*s} ${o-y*s}`).join('L')}Z" style="stroke:var(--c${i?3:1});stroke-width:2.5"/>`+tx(o+q[0][0]*s+(i?-12:12),o-q[0][1]*s-6,n)).join(''))};
const tf=k=>{let a=R(1,2),b=R(1,2),T=[[a,b],[a+2,b],[a,b+1+R(0,1)]],I,w;
if(k==0)[I,w]=P([[T.map(([x,y])=>[-x,y]),'Reflection in the y-axis'],[T.map(([x,y])=>[x,-y]),'Reflection in the x-axis']]);

else if(k==2)[I,w]=P([[T.map(([x,y])=>[6-x,y]),'Reflection in the line x = 3'],[T.map(([x,y])=>[x,6-y]),'Reflection in the line y = 3']]);
else if(k==3){T=[[1,1],[2,1],[1,2]];I=T.map(([x,y])=>[2*x,2*y]);w='Enlargement, scale factor 2, centre (0, 0)'}
else[I,w]=P([[T.map(([x,y])=>[y,-x]),'Rotation 90° clockwise about (0, 0)'],[T.map(([x,y])=>[-y,x]),'Rotation 90° anticlockwise about (0, 0)'],[T.map(([x,y])=>[-x,-y]),'Rotation 180° about (0, 0)']]);
return[`Describe fully the single transformation that maps A onto B.${gr([T,'A'],[I,'B'])}`,w]};

const cp=(d,r=60)=>[Math.round(120+r*Math.cos(d*D)),Math.round(90-r*Math.sin(d*D))].join(' ');

const sc=(c,m,pts,show)=>sv(250,160,`<path d="M30 10V130H230"/>`+pts.map(([x,y])=>`<circle cx=${30+x*20} cy=${130-y*12} r=3 fill=currentColor />`).join('')+(show?`<path d="M30 ${130-c*12}L230 ${130-(c+10*m)*12}"/>`:'')+tx(130,152,'x')+tx(12,70,'y'));
const bc=(l,v)=>sv(250,170,`<path d="M30 10V130H230"/>`+v.map((y,i)=>`<rect x="${42+i*48}" y="${130-y*10}" width="32" height="${y*10}" fill="currentColor" fill-opacity=".25"/>`+tx(58+i*48,146,l[i])).join('')+[0,2,4,6,8,10,12].map(t=>tx(24,134-t*10,t,'end')).join(''));
const vn=(a,ab,b,o)=>sv(250,150,`<rect x=5 y=5 width=240 height=140 /><circle cx=95 cy=75 r=50 /><circle cx=155 cy=75 r=50 />`+tx(70,80,a)+tx(125,80,ab)+tx(180,80,b)+tx(228,135,o)+tx(60,30,'A')+tx(190,30,'B'));
const nl=(v,op)=>{let x=150+v*20,r=op=='>'||op=='≥';return sv(300,60,`<path d="M20 30H280"/>`+[...Array(11)].map((_,i)=>`<path d="M${50+i*20} 25v10"/>`+tx(50+i*20,52,mn(i-5))).join('')+`<path d="M${x} 30H${r?270:30}" style="stroke-width:4"/><circle cx=${x} cy=30 r=5 style="fill:${'≥≤'.includes(op)?'currentColor':'var(--bg)'}"/>`)};
const hs=fd=>{let e=[0,10,20,40,60];return sv(250,165,`<path d="M30 10V130H230"/>`+fd.map((y,i)=>`<rect x="${30+e[i]*3}" y="${130-y*20}" width="${(e[i+1]-e[i])*3}" height="${y*20}" fill="currentColor" fill-opacity=".25"/>`+tx(30+e[i]*3,144,e[i])).join('')+tx(210,144,60)+[1,2,3,4,5].map(t=>tx(24,134-t*20,t,'end')).join('')+tx(130,160,'Time (minutes)')+tx(10,60,'FD'));};
const bp=(...rows)=>sv(280,rows.length*50+44,rows.map((r,i)=>{let y=8+i*50,X=v=>20+v*2;return`<path d="M${X(r[0])} ${y+15}H${X(r[1])}M${X(r[4])} ${y+15}H${X(r[3])}M${X(r[0])} ${y+8}v14M${X(r[4])} ${y+8}v14"/><rect x="${X(r[1])}" y="${y}" width="${(r[3]-r[1])*2}" height="30"/><path d="M${X(r[2])} ${y}v30"/>`+(rows.length>1?tx(10,y+19,'AB'[i]):'')}).join('')+`<path d="M20 ${rows.length*50+10}H260"/>`+[0,20,40,60,80,100,120].map(v=>`<path d="M${20+v*2} ${rows.length*50+10}v5"/>`+tx(20+v*2,rows.length*50+30,v)).join(''));
const cfg=(b,cf,n)=>{let k=120/n,X=v=>30+v*4,Y=v=>140-v*k;return sv(270,185,`<path d="M30 20V140H240"/>`+b.map(v=>`<path d="M${X(v)} 140v4"/>`+tx(X(v),156,v)).join('')+[0,1,2,3,4].map(i=>{let v=n/4*i;return`<path d="M26 ${Y(v)}h4"/>`+tx(24,Y(v)+4,v,'end')}).join('')+`<path d="M${b.map((x,i)=>`${X(x)} ${Y(cf[i])}`).join('L')}"/>`+tx(140,176,'Time (minutes)')+tx(8,80,'CF'))};

const gx=(f,a,b,st=.1)=>{let p=[];for(let x=a;x<=b+1e-9;x+=st)p.push(`${(130+x*20).toFixed(1)} ${(100-f(x)*10).toFixed(1)}`);return'M'+p.join('L')};
const gp=(...ps)=>sv(260,200,`<path d="${[...Array(13)].map((_,i)=>`M${10+i*20} 0V200`).join('')}${[...Array(11)].map((_,i)=>`M0 ${i*20}H260`).join('')}" style="stroke-width:.3"/><path d="M10 100H250M130 5V195"/>`+[-6,-4,-2,2,4,6].map(v=>tx(130+v*20,114,mn(v))).join('')+[-8,-4,4,8].map(v=>tx(124,104-v*10,mn(v),'end')).join('')+ps.map(q=>`<path d="${q}" style="stroke:var(--c3);stroke-width:2.2"/>`).join(''));
const dv=n=>[...Array(n)].map((_,i)=>i+1).filter(i=>n%i==0);
const ST=['Number','Algebra','Shape and space','Data handling','Probability'];
// [strand, topic, Higher-only, H => [level1, level2, level3]]
const T=[
[0,'Order of operations',0,H=>[
()=>{let a=R(2,9),b=R(2,9),c=R(2,9);return[`Work out ${a} + ${b} × ${c}`,a+b*c]},
()=>{let a=R(2,6),b=R(2,9),c=R(2,9),d=R(2,6);return[`Work out ${a} × (${b} + ${c}) − ${d}²`,a*(b+c)-d*d]},
()=>{let a=R(2,6),b=R(2,6),c=R(5,12),d=R(2,4);return[`Work out (−${a})² − ${b} × (${c} − ${d})`,mn(a*a-b*(c-d))]}]],
[0,'Fractions',0,H=>[
()=>{let d=R(6,12),a=R(1,5),b=R(1,5);return[`Work out ${fr(a,d)} + ${fr(b,d)}`,sf(a+b,d)]},
()=>{let b=P([2,3,4,5,6]),d=P([3,4,5,8,10]);if(b==d)d=7;let a=R(1,b-1),c=R(1,d-1),o=P([1,-1]),n=a*d+o*c*b;if(n<=0){o=1;n=a*d+c*b}return[`Work out ${fr(a,b)} ${o>0?'+':'−'} ${fr(c,d)}`,sf(n,b*d)]},
()=>{let a=R(1,4),b=R(a+1,7),c=R(1,4),d=R(c+1,7);return H?[`Work out ${fr(a,b)} ÷ ${fr(c,d)}`,sf(a*d,b*c)]:[`Work out ${fr(a,b)} × ${fr(c,d)}`,sf(a*c,b*d)]}]],

()=>{let p=P([5,10,20,25,50]),m=P([40,60,80,120,200,240]);return[`Work out ${p}% of £${m}`,`£${m*p/100}`]},

()=>{if(H){let p=P([10,20,25,50]),o=P([40,60,80,100,200]);return[`After a ${p}% increase, a price is £${o*(100+p)/100}. Work out the original price.`,`£${o}`]}let b=P([20,25,40,50,200]),a=R(1,b-1);return[`Write £${a} as a percentage of £${b}.`,`${+(a*100/b).toFixed(2)}%`]}]],
[0,'Ratio and proportion',0,H=>[

js.forEach((j,i)=>{let p=3+3*i,cs=`q 595 0 0 842 0 0 cm /Im${i} Do Q`;obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im${i} ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`);obj(p+1,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);off[p+2]=len;add(`${p+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.b.length} >>\nstream\n`);add(j.b);add('\nendstream\nendobj\n')});
let x=len,tot=3*n+3;add(`xref\n0 ${tot}\n0000000000 65535 f \n`);for(let k=1;k<tot;k++)add(String(off[k]).padStart(10,'0')+' 00000 n \n');add(`trailer\n<< /Size ${tot} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`);
let out=new Uint8Array(len),p=0;parts.forEach(b=>{out.set(b,p);p+=b.length});return out}
async function makePdf(ans){const W=794,Hp=1123,css=document.querySelector('style').textContent,one=$('#cols').classList.contains('one'),colr=['#12803f','#b86e00','#b3261e'];
let cols=[...$('#cols').querySelectorAll('section')].map(s=>({c:colr[s.dataset.l-1],h:s.querySelector('h2').textContent,li:[...s.querySelectorAll('li')].map(l=>({n:l.querySelector('.qn').textContent,q:l.querySelector('.q').innerHTML,a:l.querySelector('.a').innerHTML}))}));
const wrap=(f,t)=>{let d=document.createElement('div');d.className='wsx '+(ans?'k':'w')+(one?' one':'');d.style.cssText=`position:absolute;left:-9999px;top:0;width:${W}px;box-sizing:border-box`;d.innerHTML=`<div class="ph"><span>${$('#pt').textContent}</span><span>Name ____________ Date ________</span></div><div class="cs">${cols.map(k=>`<section style="--c:${k.c}"><h2>${k.h}</h2><ol>${k.li.slice(f,t).map(x=>`<li><b class="qn">${x.n}</b><div class="q">${x.q}</div><div class="a">${x.a}</div></li>`).join('')}</ol></section>`).join('')}</div>`;return d};
let full=wrap(0,99);document.body.appendChild(full);let hs=[...full.querySelectorAll('section')].map(s=>[...s.querySelectorAll('li')].map(l=>l.offsetHeight)),top=full.querySelector('.ph').offsetHeight+full.querySelector('h2').offsetHeight+50;full.remove();
let pg=[],i=0,N=Math.max(...hs.map(a=>a.length));while(i<N){let j=i,tot=hs.map(()=>0);while(j<N){let nt=hs.map((a,k)=>tot[k]+(a[j]||0));if(Math.max(...nt)+top>Hp-30&&j>i)break;tot=nt;j++}pg.push([i,j]);i=j}
let js=[];for(const[f,t]of pg){let d=wrap(f,t);d.style.cssText=`width:${W}px;height:${Hp}px;box-sizing:border-box;overflow:hidden`;let st=document.createElement('style');st.textContent=css;d.prepend(st);
let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W*2}" height="${Hp*2}" viewBox="0 0 ${W} ${Hp}" data-theme="light"><foreignObject width="${W}" height="${Hp}">${new XMLSerializer().serializeToString(d)}</foreignObject></svg>`;
let img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error('render'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
let cv=document.createElement('canvas');cv.width=W*2;cv.height=Hp*2;let g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);
let u=cv.toDataURL('image/jpeg',.92).split(',')[1],bin=atob(u),b=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)b[k]=bin.charCodeAt(k);js.push({b,w:cv.width,h:cv.height})}
return buildPdf(js)}
async function dlPdf(ans){let m=$('#msg');m.textContent='Preparing PDF…';let d=null;try{d=await window.claude?.use('downloads')}catch(e){}
if(!d){m.textContent='Downloads are not available in this view, so opening the print dialog instead.';document.body.classList.add(ans?'pa':'ws');print();return}
let b;try{b=await makePdf(ans)}catch(e){m.textContent='Could not make a PDF here ('+(e&&e.message||e)+'). Saving an HTML worksheet instead.';await saveHtml(ans);return}
try{await d.save({filename:'maths-'+(ans?'answers':'worksheet')+'.pdf',data:b});m.textContent='PDF ready.'}catch(e){m.textContent=e&&e.code=='declined'?'Download cancelled.':'Could not save: '+(e&&e.message||e)}}
$('#pw').onclick=()=>dlPdf(0);$('#pa').onclick=()=>dlPdf(1);
onafterprint=()=>document.body.classList.remove('ws','pa');
