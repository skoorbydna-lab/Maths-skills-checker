<style>

<script>

['Single bracket',L=>{let a=R(2,9),b=R(L>1?-8:1,9)||3;if(L==3)return P([[`Expand x${bi(b)}`,pl([1,X2],[b,'x'])],[`Expand −${a}${bi(b)}`,pl([-a,'x'],[-a*b,''])]]);if(L==2){let c=R(2,5);return[`Expand ${a}${bi(b,c)}`,pl([a*c,'x'],[a*b,''])]}return[`Expand ${a}${bi(b)}`,pl([a,'x'],[a*b,''])]}],

['Grouped data',L=>{let f,c=['0 < t ≤ 10','10 < t ≤ 20','20 < t ≤ 30','30 < t ≤ 40'];do{f=[0,1,2,3].map(()=>R(3,12))}while(f.filter(v=>v==Math.max(...f)).length>1);let t=`<table class=t><tr><th>Time (t min)</th>${c.map(v=>`<td>${v}</td>`).join('')}</tr><tr><th>Frequency</th>${f.map(v=>`<td>${v}</td>`).join('')}</tr></table>`,n=sm1(f);if(L==1)return[`Write down the modal class.${t}`,c[f.indexOf(Math.max(...f))]];if(L==2){let k=0,cu=0;while(cu+f[k]<(n+1)/2){cu+=f[k];k++}return[`Which class contains the median?${t}`,c[k]]}return[`Estimate the mean (1 d.p.).${t}`,(f.reduce((x,v,i)=>x+v*(10*i+5),0)/n).toFixed(1)]}]]

['Sharing in a ratio',L=>{let a=R(1,4),b=R(a+1,6),k=R(2,9),c=R(2,5);return L==1?[`Share £${(a+b)*k} in the ratio ${a} : ${b}.`,`£${a*k} and £${b*k}`]:L==2?[`Share £${(a+b+c)*k} in the ratio ${a} : ${b} : ${c}.`,`£${a*k}, £${b*k} and £${c*k}`]:[`Two people share money in the ratio ${a} : ${b}. The difference between their shares is £${(b-a)*k}. How much money was shared?`,`£${(a+b)*k}`]}],
['Scaling quantities',L=>{let n=P([4,6,8]),u=P([25,50,75]),m=L==1?P([2,3,10,12]):P([5,9,14,20]);return L<3?[`A recipe for ${n} people uses ${n*u} g of flour. How much flour is needed for ${m} people?`,`${u*m} g`]:[`A recipe for ${n} people uses ${n*u} g of flour. How many people can be served with ${u*m} g of flour?`,m]}],
['Given one part',L=>{let a=R(2,5),b=R(a+1,8),k=R(2,9);return L==1?[`The ratio of red to blue counters is ${a} : ${b}. There are ${a*k} red counters. How many blue counters are there?`,b*k]:L==2?[`The ratio of red to blue counters is ${a} : ${b}. There are ${b*k} blue counters. How many counters are there altogether?`,(a+b)*k]:[`The ratio of boys to girls is ${a} : ${b}. There are ${(b-a)*k} more girls than boys. How many students are there?`,(a+b)*k]}],
['Combining ratios',L=>{let a=R(1,4),b=P([3,4,6]),b2=L==1?b:P([2,4,5]),c=R(2,7),A=a*b2,B=b*b2,C=c*b,g=G(G(A,B),C);if(L<3)return[`A : B = ${a} : ${b} and B : C = ${b2} : ${c}. Write A : B : C in its simplest form.`,`${A/g} : ${B/g} : ${C/g}`];let s=(A+B+C)/g,k=R(2,6);return[`A : B = ${a} : ${b} and B : C = ${b2} : ${c}. £${s*k} is shared in the ratio A : B : C. How much does B get?`,`£${B/g*k}`]}]],
'Sequences (nth term)':[
['Continuing patterns',L=>{let f=R(1,10),d=L==1?R(2,6):L==2?P([-2,-3,-4,5,7]):P([.5,1.5,-.5,2.5]),s=[0,1,2,3].map(i=>+(f+i*d).toFixed(1));return[`Write down the next two terms: ${mn(s.join(', '))}, …`,mn(`${+(f+4*d).toFixed(1)}, ${+(f+5*d).toFixed(1)}`)]}],
['Term-to-term rules',L=>{let a=R(1,6),d=R(2,6);if(L==1)return[`A sequence starts at ${a}. The rule is “add ${d}”. Write down the first 4 terms.`,[0,1,2,3].map(i=>a+i*d).join(', ')];if(L==2){let r=P([2,3]);return[`A sequence starts at ${a}. The rule is “multiply by ${r}”. Write down the first 4 terms.`,[0,1,2,3].map(i=>a*r**i).join(', ')]}let b=R(2,6),t=[a,b];for(let i=0;i<3;i++)t.push(t[i]+t[i+1]);return[`A sequence starts ${a}, ${b}. Each term is the sum of the two terms before it. Write down the next three terms.`,t.slice(2).join(', ')]}],
['nth term of an arithmetic sequence',L=>{let f=L==3?R(10,40):R(1,12),d=L==1?R(2,5):L==2?P([-2,-3,-4,6,7,8]):R(2,9),s=[0,1,2,3].map(i=>f+i*d);return[`Find the nth term of ${mn(s.join(', '))}, …`,pl([d,'n'],[f-d,''])]}],
['Is a number in the sequence?',L=>{let d=R(2,7),c=R(-3,9),n=R(10,30),y=Math.random()<.5,v=d*n+c+(y?0:R(1,d-1));return[`The nth term of a sequence is ${pl([d,'n'],[c,''])}. Is ${v} a term of the sequence? Show your working.`,y?`Yes, it is term number ${n}`:'No, n would not be a whole number']}],
['Quadratic sequences',L=>{let a=R(1,3),b=R(-3,5),c=R(-4,5),s=[1,2,3,4,5].slice(0,L==1?4:5).map(n=>a*n*n+b*n+c);return[`Find the nth term of ${mn(s.join(', '))}, …`,pl([a,up('n',2)],[b,'n'],[c,''])]},1]],

['Parallel and perpendicular lines',(L,H)=>{let m=R(-4,5)||2,c=R(-5,6),x=R(-3,3),y=R(-4,5);if(L==1)return[`Write down the gradient of any line parallel to y = ${pl([m,'x'],[c,''])}.`,mn(m)];if(L==2||!H)return[`Find the equation of the line parallel to y = ${pl([m,'x'],[c,''])} that passes through (${mn(x)}, ${mn(y)}).`,`y = ${pl([m,'x'],[y-m*x,''])}`];let q=P([2,-2,4,-4]),k=R(-2,3),y0=R(-4,5),b=y0+k;return[`Line L has equation y = ${pl([q,'x'],[c,''])}. Find the equation of the line perpendicular to L that passes through (${mn(q*k)}, ${mn(y0)}).`,`y = ${q>0?fr('−1',q):fr(1,-q)}x${b?(b<0?' − ':' + ')+Math.abs(b):''}`]}]],

['Distance between points',L=>{let x=R(-3,3),y=R(-3,3),[a,b,c]=P(TR),dx=L==1?a:R(1,6),dy=L==1?b:R(1,6),q=`A is (${mn(x)}, ${mn(y)}) and B is (${mn(x+dx)}, ${mn(y+dy)}). `;return L==1?[q+'Work out the length AB.',c]:L==2?[q+'Work out the length AB to 1 d.p. (calculator)',Math.hypot(dx,dy).toFixed(1)]:[q+'Work out the length AB as a surd in its simplest form.',sqr(dx*dx+dy*dy)]}],

'Volume and surface area':[

'Basic probability':[
['Single events',L=>{if(L==1){let r=R(2,8),b=R(2,8),g=R(1,6);return[`A bag has ${r} red, ${b} blue and ${g} green counters. One is taken at random. Write down the probability that it is red.`,sf(r,r+b+g)]}if(L==2){let n=R(8,12),t=P([['even',x=>x%2==0],['a multiple of 3',x=>x%3==0],['a prime number',x=>[2,3,5,7,11].includes(x)],['greater than 5',x=>x>5]]),c=[...Array(n)].map((_,i)=>i+1).filter(t[1]).length;return[`A fair spinner has sections numbered 1 to ${n}. Work out the probability of landing on ${t[0]}.`,sf(c,n)]}let w=P(['PROBABILITY','MATHEMATICS','STATISTICS','ALGEBRA']),v=[...w].filter(x=>'AEIOU'.includes(x)).length;return[`A letter is chosen at random from the word ${w}. Work out the probability that it is a vowel.`,sf(v,w.length)]}],
